<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Caro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
</head>
<body data-board-theme="default">
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="game-toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="2500">
            <div class="toast-header">
                <strong id="toast-title" class="me-auto">Thông báo</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div id="toast-body" class="toast-body">
                ...
            </div>
        </div>
    </div>

    <div class="container mt-4">
        <h1 class="text-center mb-3">Game Caro <img src="{{ url_for('static', filename='images/icons8-tic-tac-toe-67.png') }}" alt="Logo Caro" style="height: 40px;"></h1>

        <div class="card shadow-sm mb-3">
            <div class="card-header"><h4 class="mb-0">Tùy chọn ván đấu</h4></div>
            <div class="card-body">
                <form id="menu-form" class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label for="game-mode" class="form-label">Chế độ chơi</label>
                        <select id="game-mode" class="form-select">
                            <option value="pvc" selected>Người vs Máy</option>
                            <option value="pvp">Người vs Người</option>
                            <option value="cvc">Máy vs Máy</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="board-size" class="form-label">Kích thước</label>
                        <input type="number" id="board-size" class="form-control" value="10" min="7">
                    </div>
                    <div class="col-md-2">
                        <label for="win-condition" class="form-label">Số điểm thắng</label>
                        <input type="number" id="win-condition" class="form-control" value="5" min="3" max="10"input>
                    </div>

                    <div id="first-move-pvc" class="col-md-2 first-move-wrapper">
                        <label for="first-move-select" class="form-label">Ai đi trước?</label>
                        <select id="first-move-select" class="form-select">
                            <option value="human" selected>Người (X)</option>
                            <option value="ai">Máy (X)</option>
                        </select>
                    </div>
                    <div id="difficulty-pvc" class="col-md-2 difficulty-wrapper">
                        <label for="difficulty-pvc-select" class="form-label">Độ khó (vs Máy)</label>
                        <select id="difficulty-pvc-select" class="form-select">
                            <option value="easy">Dễ</option>
                            <option value="normal" selected>Thường</option>
                            <option value="hard">Khó</option>
                        </select>
                    </div>
                    <div id="difficulty-cvc1" class="col-md-2 difficulty-wrapper">
                        <label for="difficulty-ai1-select" class="form-label">Máy 1 (X)</label>
                        <select id="difficulty-ai1-select" class="form-select">
                            <option value="easy">Dễ</option>
                            <option value="normal" selected>Thường</option>
                            <option value="hard">Khó</option>
                        </select>
                    </div>
                    <div id="difficulty-cvc2" class="col-md-2 difficulty-wrapper">
                        <label for="difficulty-ai2-select" class="form-label">Máy 2 (O)</label>
                        <select id="difficulty-ai2-select" class="form-select">
                            <option value="easy">Dễ</option>
                            <option value="normal" selected>Thường</option>
                            <option value="hard">Khó</option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <button type="submit" class="btn btn-primary w-100">Bắt đầu</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="row">
            
    <div class="row mb-3"> 
            
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 id="status" class="mb-3 text-center">Chào mừng!</h5>
                        
                        <div id="game-wrapper">
                            <div id="corner-cell"></div>
                            <div id="row-coords"></div>
                            <div id="col-coords"></div>
                            <div id="board-container"></div>
                        </div>
                    </div>
                </div>
            </div> <div class="col-lg-4">
                
                <div class="card shadow-sm">
                    <div class="card-header"><h5 class="mb-0">🎨 Cài đặt giao diện</h5></div>
                    <div class="card-body">
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" role="switch" id="dark-mode-toggle">
                            <label class="form-check-label" for="dark-mode-toggle">Chế độ tối (Dark Mode)</label>
                        </div>
                        
                        <label class="form-label">Màu bàn cờ:</label>
                        <div>
                            <button class="btn btn-outline-secondary btn-sm" data-theme="default">Mặc định</button>
                            <button class="btn btn-outline-secondary btn-sm" data-theme="wood">Màu Gỗ</button>
                            <button class="btn btn-outline-secondary btn-sm" data-theme="blue">Mát mẻ</button>
                            <button class="btn btn-outline-secondary btn-sm" data-theme="dark-board">Màu Tối</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card shadow-sm mt-3 mb-3">
            <div class="card-header"><h5 class="mb-0">🌳 Game Tree Visualization</h5></div>
            <div class="card-body" style="height: 800px; overflow: hidden; position: relative;">
                <svg id="game-tree-svg" width="100%" height="800"
                    style="background: #fafafa; border: 1px solid #ddd;"></svg>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script> <!--Thu vien D3.js do thi cho game-->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
